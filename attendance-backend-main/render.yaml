services:
  - type: web
    name: e-visitors-backend
    env: node
    region: oregon
    branch: master
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_DOMAIN
        sync: false
    disk: {}
